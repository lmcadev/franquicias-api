# Configuración de Nginx como Reverse Proxy para Franquicias API
# Ubicación en Docker: /etc/nginx/nginx.conf

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ========================================================================
    # LOGGING
    # ========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ========================================================================
    # PERFORMANCE
    # ========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # ========================================================================
    # GZIP COMPRESSION
    # ========================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/xml+rss 
               application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ========================================================================
    # RATE LIMITING
    # ========================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # ========================================================================
    # UPSTREAM - Backend Application
    # ========================================================================
    upstream franquicias_backend {
        least_conn;
        server franquicias-api:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ========================================================================
    # REDIRECT HTTP to HTTPS
    # ========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # ========================================================================
    # HTTPS SERVER
    # ========================================================================
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        
        server_name _;

        # ====================================================================
        # SSL/TLS CONFIGURATION
        # ====================================================================
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ====================================================================
        # SECURITY HEADERS
        # ====================================================================
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ====================================================================
        # ROOT LOCATION
        # ====================================================================
        location / {
            return 404;
        }

        # ====================================================================
        # HEALTH CHECK ENDPOINT
        # ====================================================================
        location /health {
            access_log off;
            proxy_pass http://franquicias_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ====================================================================
        # API ENDPOINTS
        # ====================================================================
        location /api/v1 {
            # Rate limiting
            limit_req zone=api_limit burst=200 nodelay;

            # Proxy configuration
            proxy_pass http://franquicias_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 24 4k;

            # Cache control
            proxy_cache_bypass $http_pragma $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ====================================================================
        # LOGIN ENDPOINT (Stricter rate limit)
        # ====================================================================
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=10 nodelay;

            proxy_pass http://franquicias_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ====================================================================
        # ACTUATOR ENDPOINTS (Restricted)
        # ====================================================================
        location /actuator {
            # Only allow from internal network
            allow 172.20.0.0/16;
            deny all;

            proxy_pass http://franquicias_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ====================================================================
        # STATIC FILES CACHING
        # ====================================================================
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://franquicias_backend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ====================================================================
        # DENY ACCESS TO SENSITIVE FILES
        # ====================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ====================================================================
        # ERROR PAGES
        # ====================================================================
        error_page 404 /404.json;
        error_page 500 502 503 504 /5xx.json;

        location = /404.json {
            internal;
            default_type application/json;
            return 404 '{"error":"Not Found","status":404}';
        }

        location = /5xx.json {
            internal;
            default_type application/json;
            return 500 '{"error":"Internal Server Error","status":500}';
        }
    }

    # ========================================================================
    # CACHE CONFIGURATION
    # ========================================================================
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m 
                     max_size=100m inactive=60m use_temp_path=off;

    # ========================================================================
    # UPSTREAM HEALTH CHECK (for backup servers if needed)
    # ========================================================================
    # Descomenta si tienes múltiples instancias del backend
    # upstream franquicias_backend_backup {
    #     server franquicias-api-backup:8080 backup;
    # }
}
