# Configuración de la aplicación para ambiente PRODUCCIÓN

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/xml
      - text/plain
  http2:
    enabled: true

spring:
  application:
    name: franquicias-api
  webflux:
    base-path: /api/v1

  # ============================================================================
  # WEB - Error Handling
  # ============================================================================
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

  # ============================================================================
  # DATASOURCE - R2DBC (Reactive Driver para MySQL)
  # ============================================================================
  r2dbc:
    url: r2dbc:mysql://${DB_HOST:mysql-db}:${DB_PORT:3306}/${DB_NAME:franquicias_db}?sslMode=${DB_SSL_MODE:DISABLED}
    username: ${DB_USERNAME:franquicias_user}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 20
      max-size: 50
      validation-query: SELECT 1
      max-idle-time: 10m
      max-acquire-time: 5s
      max-create-connection-time: 2s
    properties:
      serverZoneId: ${TIMEZONE:America/Bogota}
      useServerPreparedStatements: true
      cachePreparedStatements: true
      preparedStatementCacheSize: 250
      preparedStatementCacheSqlLimit: 2048
      serverRSAPublicKeyFile: /etc/mysql/certs/public-key.pem

  # ============================================================================
  # ENVIRONMENT
  # ============================================================================
  # spring.profiles.active está en application.yml (recurso principal)

  # ============================================================================
  # JPA/HIBERNATE
  # ============================================================================
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50
          use_scrollable_resultset: false
        order_inserts: true
        order_updates: true

  # ============================================================================
  # JACKSON
  # ============================================================================
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    json:
      read:
        allow-java-comments: false
        allow-yaml-comments: false

  # ============================================================================
  # LOGGING - Minimal en Producción
  # ============================================================================
  logging:
    level:
      root: ${LOG_LEVEL:WARN}
      org.springframework.web: WARN
      org.springframework.security: WARN
      com.accenture.franquicias_api: INFO
      org.hibernate: WARN
    pattern:
      console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %p %t %logger{35} - %msg%n"
      file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %p %t %logger{35} - %msg%n"
    file:
      name: /var/log/franquicias-api/application.log
      max-size: 10MB
      max-history: 30
      total-size-cap: 5GB

# ============================================================================
# SPRINGDOC - OpenAPI 3.1 / Swagger habilitable en Producción
# ============================================================================
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  apiinfo:
    title: Franquicias API
    version: 1.0.0
    description: API REST para gestión de franquicias, sucursales y productos
    contact:
      name: Accenture
      email: support@accenture.com
    license:
      name: Apache 2.0

# ============================================================================
# ACTUATOR - Health & Metrics
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    metrics:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,200ms,500ms,1000ms,2000ms,5000ms
    tags:
      application: franquicias-api
      environment: ${ENVIRONMENT:prod}
  health:
    db:
      enabled: true
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# ============================================================================
# JWT (JsonWebToken)
# ============================================================================
jwt:
  secret: ${JWT_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET:${JWT_SECRET}}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}

# ============================================================================
# CORS (Cross-Origin Resource Sharing) - Restrictivo en Producción
# ============================================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.ejemplo.com,https://admin.ejemplo.com}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
  allowed-headers: ${CORS_ALLOWED_HEADERS:Content-Type,Authorization}
  allow-credentials: true
  max-age: 86400

# ============================================================================
# API CONFIGURATION
# ============================================================================
api:
  title: ${API_TITLE:Franquicias API}
  version: ${API_VERSION:1.0.0}
  description: ${API_DESCRIPTION:Gestión de franquicias, sucursales y productos}
  base-path: /api/v1
  rate-limit:
    enabled: true
    requests-per-minute: 1000
    requests-per-hour: 50000

# ============================================================================
# TIMEZONE
# ============================================================================
timezone: ${TIMEZONE:America/Bogota}

# ============================================================================
# ENVIRONMENT
# ============================================================================
environment: ${ENVIRONMENT:prod}

# ============================================================================
# SECURITY
# ============================================================================
security:
  require-https: true
  headers:
    x-content-type-options: nosniff
    x-frame-options: DENY
    x-xss-protection: "1; mode=block"
    strict-transport-security: "max-age=31536000; includeSubDomains"
