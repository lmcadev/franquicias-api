spring:
  application:
    name: franquicias-api

  # Perfiles activos (puede ser sobrescrito por variable de entorno SPRING_PROFILES_ACTIVE)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Configuración de R2DBC (Reactive Database Connectivity)
  r2dbc:
    url: r2dbc:mysql://localhost:3306/franquicias_db
    username: root
    password: password
    pool:
      initial-size: 10
      max-size: 20
      max-idle-time: 30m

  # JPA Configuration (aunque usamos R2DBC, evita conflictos)
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null

  # Security
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080

# Configuración del servidor
server:
  port: 8080
  servlet:
    context-path: /

# Logging
logging:
  level:
    root: INFO
    com.accenture.franquicias_api: DEBUG
    org.springframework.web: DEBUG
    io.r2dbc: DEBUG

# Documentación Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

# Configuración de JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 horas en milisegundos
