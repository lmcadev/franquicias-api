name: Terraform Plan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_region: us-east-1
      TF_VAR_project_name: franquicias-api
      TF_VAR_environment: dev
      TF_VAR_ssh_cidr: ${{ vars.TF_SSH_CIDR || secrets.TF_SSH_CIDR }}
      TF_VAR_key_pair_name: ${{ vars.TF_KEY_PAIR_NAME || 'Accenture_test' }}
      TF_VAR_ec2_instance_type: t2.micro
      TF_VAR_db_instance_class: db.t3.micro
      TF_VAR_db_name: franquicias_db
      TF_VAR_db_username: franquicias_user
      TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}

    defaults:
      run:
        shell: bash
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Validate required CI variables
        run: |
          test -n "${TF_VAR_ssh_cidr}" || (echo "Missing TF_SSH_CIDR (set repo Variable TF_SSH_CIDR or Secret TF_SSH_CIDR)" && exit 1)
          test -n "${TF_VAR_db_password}" || (echo "Missing repo secret TF_DB_PASSWORD" && exit 1)

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Save plan artifact
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan.txt
