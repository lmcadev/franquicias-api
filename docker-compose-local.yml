version: '3.9'

services:
  # ============================================
  # MYSQL DATABASE - LOCAL
  # ============================================
  mysql-db:
    image: mysql:8.0
    container_name: franquicias-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-franquicias_root_2024}
      MYSQL_USER: ${MYSQL_USER:-franquicias_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-franquicias_pass_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-franquicias_db}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_local:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - franquicias-local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  # ============================================
  # FRANQUICIAS API - LOCAL
  # ============================================
  franquicias-api:
    build:
      context: .
      dockerfile: Dockerfile.local
    env_file:
      - .env
    container_name: franquicias-api-local
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: mysql-db
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${MYSQL_DATABASE:-franquicias_db}
      DB_USERNAME: ${MYSQL_USER:-franquicias_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-franquicias_pass_2024}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      SPRING_LOG_LEVEL: ${SPRING_LOG_LEVEL:-INFO}
      TZ: ${TIMEZONE:-America/Bogota}
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - /app/target
    networks:
      - franquicias-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger-ui.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # PHPMYADMIN - ADMIN DE BD (OPCIONAL)
  # ============================================
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: franquicias-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql-db
    environment:
      PMA_HOST: mysql-db
      PMA_USER: ${MYSQL_USER:-franquicias_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-franquicias_pass_2024}
      PMA_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-franquicias_root_2024}
    ports:
      - "8081:80"
    networks:
      - franquicias-local
    profiles:
      - debug

networks:
  franquicias-local:
    driver: bridge

volumes:
  mysql_data_local:
    driver: local
